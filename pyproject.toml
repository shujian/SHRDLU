[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "shrdlu"
version = "0.2.0"
description = "A two-program test bed for understanding a limited world"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
# Deliberately no runtime dependencies: the whole system is standard library.
dependencies = []

[project.optional-dependencies]
# Needed for PNG output, and therefore for showing a testee a picture
# (--observe image).  SVG output and everything else is stdlib-only.
png = ["pillow"]

[project.scripts]
shrdlu-env = "shrdlu.env.cli.env_main:main"
shrdlu-testee = "shrdlu.testee.cli.testee_main:main"
shrdlu-scene = "shrdlu.env.cli.scene_main:main"
shrdlu-exam = "shrdlu.env.cli.exam_main:main"
shrdlu-play = "shrdlu.env.cli.play_main:main"
shrdlu-render = "shrdlu.env.cli.render_main:main"
shrdlu-report = "shrdlu.env.cli.report_main:main"

[tool.setuptools]
packages = ["shrdlu", "shrdlu.env", "shrdlu.env.cli", "shrdlu.testee", "shrdlu.testee.cli"]
include-package-data = true

[tool.setuptools.package-data]
shrdlu = ["scenarios/*.json"]
