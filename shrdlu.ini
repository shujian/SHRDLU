# shrdlu 的默认值。命令行参数会覆盖这里；本文件改坏了会直接报错。
#
# 查找顺序：SHRDLU_CONFIG 指的文件 → 当前目录及其各级父目录的 shrdlu.ini
#          → 项目根目录的 shrdlu.ini → 内置默认值。
# 公共段 [shrdlu] 所有程序都读；某个程序的段只覆盖它自己不同的键。
# 查看当前生效的值：python3 -m shrdlu.settings [--program env]

[shrdlu]
scenario           =                                  # 默认场景（留空 = first-version）；只因 seed 而现场生成整卷时，这一项留空
questions          = 0                                # 0 = 用场景自带的题库；大于 0 = 现场重出这么多道题
seed               =                                  # 与 questions 同用时是出题种子；单独给就现场造一整份考卷
shapes             = attr,rel,count,exists,all        # 现场出题时允许的题型
testee             = example                          # 已知实现名（example）、模块:类，或一条命令
observe            = state                            # 测试开始时给什么：state（符号）或 image（一张图）
timeout            = 10.0                             # 等被测者每条回复的秒数
record             =                                  # 把测试记录写成 JSON 的路径；留空 = 不写
quiet              = no                               # 只打印结论

[shrdlu-play]
pause              = yes                              # 每步停下来；关掉就一口气跑完

[shrdlu-report]
out                = report.html                      # 报告写到哪个文件
open               = no                               # 写好之后用浏览器打开

[shrdlu-render]
scenario           =                                  # 画这个场景；留空 = 按 seed 现场生成
stage              = initial                          # 渲染哪个状态：initial / final / both
scale              = 2.0                              # PNG 的像素倍率
labels             = yes                              # 是否画 id 标签
out_dir            =                                  # 批量输出目录（每个状态一张 SVG）

[shrdlu-scene]
level              = 1                                # 场景等级（目前只有 1）
out_dir            =                                  # 批量输出目录

[shrdlu-exam]
scene              =                                  # 给这个场景出题；留空 = 按 seed 现场造一个
seed               = 0                                # 造场景与出题用的种子
questions          = 10                               # 写多少道题
steps              =                                  # 指令条数；留空 = 出题器自选（3 或 4）
illegal            = 1                                # 其中几条是陷阱指令
reasoning_ratio    = 0.5                              # 「必须推演」的题所占比例下限
out                =                                  # 写出的考卷路径

[shrdlu-testee]
impl               = example                          # 跑哪个实现

[shrdlu-env]
# 测试者没有自己的键：它全部读上表的公共段。
